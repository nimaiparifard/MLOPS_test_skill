stages:
  generate_data:
    cmd: python -m pipeline.generate_risklens_data --seed ${generate.seed}
    deps:
      - pipeline/generate_risklens_data.py
    params:
      - generate
    outs:
      - data/risklens

  create_dataset:
    cmd: python -m pipeline.create_dataset
    deps:
      - pipeline/create_dataset.py
      - mlcore
      - data/risklens/credit_applications.csv
      - data/risklens/card_transactions.csv
    params:
      - dataset
    outs:
      - data/train.csv
      - data/val.csv
      - data/test.csv

  tune:
    cmd: python -X utf8 -m pipeline.tuning_experiment
    deps:
      - pipeline/tuning_experiment.py
      - mlcore
      - data/train.csv
      - data/val.csv
    params:
      - tuning
    outs:
      - best_params.json:
          cache: false

  train:
    cmd: python -X utf8 -m pipeline.train
    deps:
      - pipeline/train.py
      - mlcore
      - data/train.csv
      - data/val.csv
      - best_params.json
    params:
      - train
    outs:
      - model.joblib
      - threshold.json:
          cache: false

  test:
    cmd: python -m pipeline.test
    deps:
      - pipeline/test.py
      - mlcore
      - model.joblib
      - threshold.json
      - data/test.csv
    outs:
      - data/predictions.csv

  evaluate:
    cmd: python -m pipeline.evaluate
    deps:
      - pipeline/evaluate.py
      - mlcore
      - data/predictions.csv
      - threshold.json
    metrics:
      - metrics.json:
          cache: false
    outs:
      - plots

  register_model:
    cmd: python -X utf8 -m pipeline.register_model
    deps:
      - pipeline/register_model.py
      - mlcore
      - model.joblib
      - metrics.json
      - plots
    params:
      - dataset
    outs:
      - registry.json:
          cache: false
