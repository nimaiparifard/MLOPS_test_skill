stages:
  create_dataset:
    cmd: python create_dataset.py
    deps:
      - create_dataset.py
    params:
      - dataset
    outs:
      - data/train.csv
      - data/test.csv

  add_data:
    cmd: python add_data.py
    deps:
      - add_data.py
    params:
      - dataset
      - extra_data
    outs:
      - data/extra.csv

  merge_data:
    cmd: python merge_data.py
    deps:
      - merge_data.py
      - data/train.csv
      - data/extra.csv
    outs:
      - data/train_full.csv

  train:
    cmd: python train.py
    deps:
      - train.py
      - data/train_full.csv
    outs:
      - model.joblib

  test:
    cmd: python test.py
    deps:
      - test.py
      - model.joblib
      - data/test.csv
    outs:
      - data/predictions.csv

  evaluate:
    cmd: python evaluate.py
    deps:
      - evaluate.py
      - data/predictions.csv
    metrics:
      - metrics.json:
          cache: false
